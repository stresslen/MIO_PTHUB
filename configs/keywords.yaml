  # Nhóm B — Chuyển đổi số (Digital Transformation & Data)
  group_b_digital_transformation:
    name: "Chuyển đổi số & Dữ liệu"
    keywords:
      - "chuyển đổi số"
      - "CĐS"
      - "số hóa"
      - "số hóa tài liệu"
      - "số hóa dữ liệu"
      - "cơ sở dữ liệu"
      - "CSDL"
      - "dữ liệu số"
      - "kho dữ liệu"
      - "Data Warehouse"
      - "Data Lake"
      - "nền tảng số"
      - "hệ thống thông tin"
      - "HTTT"
      - "chính quyền số"
      - "chính phủ số"
      - "dịch vụ công trực tuyến"
      - "tích hợp hệ thống"
