      - "hạ tầng số"
      - "công nghệ thông tin"
      - "CNTT"
      - "tin học hóa"

# Chiến lược kết hợp từ khóa đa nhóm (Multi-Group Cross Search Matrix)
combination_strategies:
  - name: "Công nghệ + Chuyển đổi số"
    formula: "Group A + Group B"
    weight_bonus: 30
    example: "'AI' + 'chuyển đổi số', 'OCR' + 'số hóa tài liệu'"

