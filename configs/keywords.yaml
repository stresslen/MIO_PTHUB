# ==============================================================================
# AI Lead Intelligence & Crawler - Keyword Strategy & Taxonomy
# Chia thành 5 Nhóm Từ Khóa (A, B, C, D, E) và Cơ Chế Tìm Kiếm Kết Hợp
# ==============================================================================

# Các cụm có tín hiệu cao dùng ở tầng tìm kiếm của website. Không dùng từ "AI"
# độc lập vì trong tiếng Việt nó dễ khớp nhầm với đại từ "ai".
discovery_search:
  max_queries: 6
  keywords:
    - "chuyển đổi số"
    - "trí tuệ nhân tạo"
    - "số hóa"
    - "công nghệ thông tin"
    - "phần mềm"
    - "cơ sở dữ liệu"

keyword_groups:
  # Nhóm A — Công nghệ (Core Tech & AI Solutions)
  group_a_technology:
    name: "Công nghệ & AI"
    keywords:
      - "AI"
      - "trí tuệ nhân tạo"
      - "Generative AI"
      - "GenAI"
      - "Machine Learning"
      - "học máy"
      - "Deep Learning"
      - "Computer Vision"
      - "thị giác máy tính"
      - "nhận diện hình ảnh"
      - "Camera AI"
      - "nhận diện khuôn mặt"
      - "eKYC"
      - "sinh trắc học"
      - "OCR"
      - "nhận dạng ký tự"
      - "nhận dạng tài liệu"
      - "bóc tách biểu mẫu"
      - "Speech-to-Text"
      - "Text-to-Speech"
      - "Voice AI"
      - "nhận diện giọng nói"
      - "tổng đài thông minh"
      - "trợ lý ảo"
      - "Chatbot"
      - "phân tích âm thanh"
      - "hệ thống ghi âm"
      - "hội nghị truyền hình"
      - "phần mềm họp trực tuyến"
      - "GIS"
      - "bản đồ số"
      - "IOC"
      - "trung tâm điều hành thông minh"
      - "Cloud"
      - "điện toán đám mây"
      - "Data Center"
      - "trung tâm dữ liệu"
      - "Cybersecurity"
      - "an toàn thông tin"
      - "an ninh mạng"
      - "bảo mật hệ thống"
      - "SOC"
      - "trung tâm an ninh mạng"
      - "IoT"
      - "internet vạn vật"
      - "Smart City"
      - "đô thị thông minh"
      - "Bệnh án điện tử"
      - "EMR"
      - "Hồ sơ điện tử"
      - "Văn phòng điện tử"
      - "Lưu trữ điện tử"
      - "ERP"
