services:
  - type: web
    name: mio-ai-lead-intelligence
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////tmp/mio-cache.db
      - key: XAH_SEARCH_URL
        value: https://api.xah.io/v1/search
      - key: XAH_SEARCH_MODEL
        value: dungcsnd113/gpt-5.6-terra
      - key: XAH_SEARCH_TYPE
        value: web
      - key: XAH_MAX_RESULTS
        value: 5
      - key: XAH_COUNTRY
        value: Vietnam
      - key: XAH_LANGUAGE
        value: Vietnam
      - key: XAH_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: APIFY_LINKEDIN_ACTOR_ID
        value: harvestapi/linkedin-post-search
      - key: APIFY_LINKEDIN_MAX_POSTS_PER_KEYWORD
        value: 1000
      - key: APIFY_LINKEDIN_PROFILE_SCRAPER_MODE
        value: short
      - key: APIFY_LINKEDIN_CONTENT_TYPE
        value: jobs
      - key: APIFY_LINKEDIN_SORT_BY
        value: relevance
      - key: APIFY_LINKEDIN_RUN_TIMEOUT_SECONDS
        value: 9000
      - key: TOPCV_PROXY_URL
        sync: false
      - key: COMPANY_ENRICHMENT_ENABLED
        value: true
      - key: COMPANY_ENRICHMENT_MODE
        value: xah
      - key: COMPANY_PROFILE_MAX_PAGES
        value: 60
      - key: COMPANY_PROFILE_MAX_DEPTH
        value: 3
      - key: COMPANY_PROFILE_CONTEXT_CHARS
        value: 60000
      - key: COMPANY_XAH_MAX_QUERIES
        value: 3
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: levuphong2909/gemini-3.8-flash-high
      - key: GEMINI_BASE_URL
        value: https://api.xah.io/v1
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        value: 17Glsl0gB7e0YKWAmxPdDUSDysGaeujudmN21Gts0GFw
      - key: GOOGLE_SHEETS_LEADS_WORKSHEET
        value: Leads
      - key: GOOGLE_SHEETS_SETTINGS_WORKSHEET
        value: Settings
      - key: GOOGLE_SHEETS_KEYWORDS_WORKSHEET
        value: Keywords
      - key: GOOGLE_SHEETS_SOURCES_WORKSHEET
        value: Sources
      - key: GOOGLE_SHEETS_ORGANIZATIONS_WORKSHEET
        value: Organizations
      - key: GOOGLE_SHEETS_CONTACTS_WORKSHEET
        value: Contacts
      - key: GOOGLE_SHEETS_EVIDENCE_WORKSHEET
        value: Organization_Evidence
      - key: GOOGLE_SHEETS_PROJECTS_WORKSHEET
        value: Projects
      - key: GOOGLE_SHEETS_NEWS_WORKSHEET
        value: News
      - key: GOOGLE_SHEETS_JOBS_WORKSHEET
        value: Jobs
      - key: GOOGLE_SHEETS_TENDERS_WORKSHEET
        value: Tenders
      - key: GOOGLE_SHEETS_INTERACTIONS_WORKSHEET
        value: Interactions
      - key: SCHEDULER_ENABLED
        value: true
      - key: SCHEDULER_TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
